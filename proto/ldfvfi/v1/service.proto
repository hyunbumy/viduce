syntax = "proto3";

package viduce.ldfvfi;

// Service exposed by the Python daemon to orchestrate frame interpolation.
service LdfVfiService {
  // Initialize an interpolation session; daemon allocates shared memory buffers.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // Execute interpolation on frames staged in the input shared memory buffer.
  rpc InterpolateChunk(InterpolateChunkRequest) returns (InterpolateChunkResponse);

  // Finalize an active session and release shared memory and GPU cache.
  rpc DestroySession(DestroySessionRequest) returns (DestroySessionResponse);
}

// Supported pixel formats for shared memory video frames.
enum PixelFormat {
  PIXEL_FORMAT_RGB24 = 0;
  PIXEL_FORMAT_BGR24 = 1;
  PIXEL_FORMAT_RGBA32 = 2;
}

// Media stream metadata describing frame geometry and pixel layout.
message MediaMetadata {
  int32 width = 1;
  int32 height = 2;
  int32 channels = 3;
  PixelFormat pixel_format = 4;
}

// Configuration parameters controlling frame interpolation.
message VfiParameters {
  // Temporal frame rate multiplication factor (e.g. 2, 4, 8).
  int32 temporal_scale_factor = 1;

  // Number of diffusion denoising steps (default 16).
  int32 sampling_steps = 2;
}

// Request to initialize an interpolation session.
message CreateSessionRequest {
  MediaMetadata media_metadata = 1;
  VfiParameters params = 2;
}

// Response containing the daemon-assigned session identifier.
// Shared memory buffers in /dev/shm are:
//   Input:  "/viduce_<session_id>_in"
//   Output: "/viduce_<session_id>_out"
message CreateSessionResponse {
  string session_id = 1;
}

// Request to interpolate a video chunk staged in shared memory.
message InterpolateChunkRequest {
  string session_id = 1;
  uint64 chunk_index = 2;
  int32 num_input_frames = 3;
  bool is_last_chunk = 4;
}

// Response containing execution metadata for a completed interpolation chunk.
message InterpolateChunkResponse {
  uint64 chunk_index = 1;
  int32 num_output_frames = 2;
  double inference_time_ms = 3;
}

// Request to terminate an active session and release resources.
message DestroySessionRequest {
  string session_id = 1;
}

// Empty response indicating clean teardown.
message DestroySessionResponse {}
