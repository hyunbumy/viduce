name: Build

on:
  push:
    branches: [ "main" ]
  # Run for every pull request, including stacked ones that target other
  # branches.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        # Need context to use the checked-out tree, including the LFS files
        context: .
        outputs: type=cacheonly
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_TYPE=debug
        target: build
