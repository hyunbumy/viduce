[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ldfvfi"
version = "0.1.0"
description = "Local Diffusion Forcing for Video Frame Interpolation (LDF-VFI) inference engine"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "torch>=2.5.0",
    "torchvision",
    "diffusers>=0.30.0",
    "einops>=0.8.0",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=7.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
