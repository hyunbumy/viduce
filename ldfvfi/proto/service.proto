syntax = "proto3";

package viduce.vfi;

// Service exposed by the Python daemon to orchestrate frame interpolation.
service LdfVfiService {
  // Initialize an interpolation session and negotiate shared memory mapping.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // Execute interpolation on a chunk staged in the input shared memory buffer.
  rpc InterpolateChunk(InterpolateChunkRequest) returns (InterpolateChunkResponse);

  // Finalize an active session and release all associated GPU / host resources.
  rpc DestroySession(DestroySessionRequest) returns (DestroySessionResponse);
}

// Configuration parameters controlling the LDF-VFI diffusion model and tiling.
message VfiParameters {
  // Temporal frame rate multiplication factor (e.g. 2, 4, 8, 16).
  int32 temporal_scale_factor = 1;

  // Number of diffusion denoising steps (e.g. 10, 16, 25).
  int32 sampling_steps = 2;

  // Conditioning boundary noise ratio (default 0.1).
  float t_cond = 3;

  // Schedule time shift parameter governing noise distribution (default 1.0 - 8.0).
  float t_shift = 4;

  // Reference temporal chunk frame length (default 60).
  int32 train_num_frames = 5;

  // Temporal latent tile window size (default 20).
  int32 tile_min_t = 6;

  // Spatial latent tiling height in pixels (default 256).
  int32 tile_min_h = 7;

  // Spatial latent tiling width in pixels (default 256).
  int32 tile_min_w = 8;

  // Vertical spatial stride for latent tiling (default 192).
  int32 tile_stride_h = 9;

  // Horizontal spatial stride for latent tiling (default 192).
  int32 tile_stride_w = 10;
}

// Metadata describing a POSIX shared memory buffer allocated in /dev/shm.
message ShmSegmentDescriptor {
  // POSIX shared memory object name (e.g. "/viduce_shm_s123_in").
  string shm_name = 1;

  // Total allocated capacity of the shared memory segment in bytes.
  uint64 size_bytes = 2;

  // Maximum number of frames that can fit into the buffer.
  int32 max_frames = 3;

  // Native pixel width of each frame.
  int32 width = 4;

  // Native pixel height of each frame.
  int32 height = 5;

  // Number of color channels per pixel (default 3 for RGB24).
  int32 channels = 6;
}

// Request to initialize an interpolation session and bind shared memory segments.
message CreateSessionRequest {
  // Unique session identifier generated by the client.
  string session_id = 1;

  // Model parameters and scheduling configurations.
  VfiParameters params = 2;

  // Shared memory segment staging raw input video frames.
  ShmSegmentDescriptor input_shm = 3;

  // Shared memory segment receiving interpolated output frames.
  ShmSegmentDescriptor output_shm = 4;
}

// Response indicating whether session initialization succeeded.
message CreateSessionResponse {
  // Whether session creation and GPU cache initialization succeeded.
  bool success = 1;

  // Error description if session creation failed.
  string error_message = 2;
}

// Sequencing tag indicating the chunk's role in the diffusion forcing pipeline.
enum ChunkType {
  // Initial chunk: denoises frames 0..T and caches the tail boundary latent (x0_prev).
  CHUNK_FIRST = 0;

  // Forward skip chunk: denoises future window and caches boundary latents (x0_skip, x0_prev_).
  CHUNK_SKIP = 1;

  // Infill chunk: denoises gap conditioned on cached x0_prev and x0_skip.
  CHUNK_CONCAT = 2;

  // Terminal chunk: denoises remaining tail frames and flushes internal state.
  CHUNK_LAST = 3;

  // Self-contained chunk: operates independently without boundary latent persistence.
  CHUNK_STANDALONE = 4;
}

// Request to interpolate a video chunk staged in shared memory.
message InterpolateChunkRequest {
  // Target session identifier.
  string session_id = 1;

  // Monotonically increasing sequence index of the chunk.
  uint64 chunk_index = 2;

  // Scheduling role of this chunk in the diffusion forcing state machine.
  ChunkType chunk_type = 3;

  // Count of valid frames currently staged in the input shared memory buffer.
  int32 num_input_frames = 4;

  // Native width of the input frames in pixels.
  int32 input_width = 5;

  // Native height of the input frames in pixels.
  int32 input_height = 6;

  // Whether this is the final chunk in the video stream.
  bool is_last_chunk = 7;
}

// Response containing execution metadata for a completed interpolation chunk.
message InterpolateChunkResponse {
  // Whether chunk inference succeeded.
  bool success = 1;

  // Error description if chunk inference failed.
  string error_message = 2;

  // Sequence index matching the request.
  uint64 chunk_index = 3;

  // Count of valid interpolated frames written to the output shared memory buffer.
  int32 num_output_frames = 4;

  // Execution duration spent on GPU inference in milliseconds.
  double inference_time_ms = 5;
}

// Request to terminate an active session and release GPU resources.
message DestroySessionRequest {
  // Session identifier to terminate.
  string session_id = 1;
}

// Response indicating whether session teardown succeeded.
message DestroySessionResponse {
  // Whether session resources were successfully released.
  bool success = 1;

  // Error description if teardown encountered an error.
  string error_message = 2;
}
